---

- hosts: all
  become: true
  tasks:

  - name: update repository index
    apt:
      update_cache: true
    when: ansible_distribution == "Ubuntu"

  - name: install apache2 package
    apt:
      name: apache2
      state: latest
    when: ansible_distribution in ["Debian", "Ubuntu"]

  - name: install php
    dnf:
      name: php
      state: latest
    when: ansible_distribution == "RedHat" and ansible_distribution_version == "9.8"
