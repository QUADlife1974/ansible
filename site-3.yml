---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (RedHat)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_facts["distribution"] == "RedHat"

  - name: install updates (Ubuntu)
    tags: always    
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_facts["distribution"] == "Ubuntu"

- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php for Ubuntu servers
    tags: apache,apache2,ubuntu
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_facts["distribution"] == "Ubuntu"

  - name: install apache and php for RedHat servers
    tags: apache,RedHat,httpd
    dnf:
      name:
        - httpd
        - php
      state: latest
    when: ansible_facts["distribution"] == "RedHat"

  - name: change email address
    tags: apache,RedHat,httpd
    lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin somebody@somewhere.net
    when: ansible_facts["distribution"] == "RedHat"
    register: httpd

  - name: restart httpd (Redhat)
    tags: apache,centos,httpd
    service:
      name: httpd
      state: restarted
    when: httpd.changed

  - name: start httpd (RedHat)
    tags: apache,centos,httpd
    service:
      name: httpd
      state: started
    when: ansible_facts["distribution"] == "RedHat"

  - name: copy default html file for site
    tags: apache,apache2,httpd
    copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

- hosts: db_servers
  become: true
  tasks:

  - name: install mariadb package(RedHat)
    tags: RedHat,db,mariadb    
    dnf:
      name: mariadb-server
      state: latest
    when: ansible_facts["distribution"] == "RedHat"

  - name: install mariadb package(Ubunt)
    tags: ubuntu,db,mariadb    
    apt:
      name: mariadb-server
      state: latest
    when: ansible_facts["distribution"] == "Ubuntu"

- hosts: file_servers
  become: true
  tasks:

  - name: install samba package
    tags: samba
    package:
      name: samba
      state: latest
